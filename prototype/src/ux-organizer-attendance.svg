<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#788697"/></marker></defs><rect x="0" y="0" width="1100" height="900" rx="0" fill="#F4F6F9" stroke="none"/><text x="36" y="48" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#182332">Organizer flow 02 • Attendance and report</text><text x="36" y="82" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Low-fidelity P0 mockups • FR-02 / FR-09 / FR-10</text><rect x="35" y="125" width="495" height="670" rx="12" fill="white" stroke="#CFD7E0"/><rect x="35" y="125" width="495" height="48" rx="12" fill="#FFF1E7" stroke="none"/><text x="53" y="156" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#182332">Check in • Career networking evening</text><rect x="60" y="195" width="445" height="165" rx="12" fill="#F4F6F9" stroke="#CFD7E0"/><text x="85" y="270" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#182332">Camera / QR scanning area</text><text x="85" y="312" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Manual code entry is a fallback</text><text x="60" y="410" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Ticket code</text><rect x="60" y="422" width="440" height="46" rx="7" fill="white" stroke="#CFD7E0"/><text x="72" y="452" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#182332">DEMO-1042</text><rect x="60" y="495" width="235" height="48" rx="12" fill="#E96C23" stroke="none"/><text x="78" y="526" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Verify ticket</text><rect x="60" y="570" width="440" height="90" rx="12" fill="#E6F4ED" stroke="#CFD7E0"/><text x="80" y="604" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#182332">Success</text><text x="80" y="636" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Attendance saved once.</text><text x="60" y="704" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Already checked in → no second record</text><text x="60" y="734" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Cancelled / wrong event → reject</text><text x="60" y="764" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">Unauthorized organizer → deny access</text><rect x="570" y="125" width="495" height="670" rx="12" fill="white" stroke="#CFD7E0"/><rect x="570" y="125" width="495" height="48" rx="12" fill="#FFF1E7" stroke="none"/><text x="588" y="156" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#182332">Participants and report</text><text x="595" y="215" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#182332">Registrations 100   Checked in 72</text><rect x="595" y="250" width="445" height="48" rx="12" fill="#FFF1E7" stroke="none"/><text x="610" y="282" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#182332">Participant         Status</text><text x="610" y="340" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182332">Student A</text><text x="825" y="340" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#182332">Checked in</text><path d="M595 358 L1040 358" stroke="#788697" stroke-width="2" fill="none"/><text x="610" y="398" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182332">Student B</text><text x="825" y="398" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#182332">Confirmed</text><path d="M595 416 L1040 416" stroke="#788697" stroke-width="2" fill="none"/><text x="610" y="456" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182332">Student C</text><text x="825" y="456" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#182332">Cancelled</text><path d="M595 474 L1040 474" stroke="#788697" stroke-width="2" fill="none"/><rect x="595" y="515" width="195" height="48" rx="12" fill="#E96C23" stroke="none"/><text x="613" y="546" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Export CSV</text><rect x="815" y="515" width="195" height="48" rx="12" fill="#215CAB" stroke="none"/><text x="833" y="546" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="white">Export PDF</text><text x="595" y="620" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#596778">Export ready: 100 active registrations,</text><text x="595" y="653" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#596778">72 unique attendance records.</text><text x="595" y="686" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#596778">Cancelled registrations stay separate.</text><text x="595" y="719" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#596778">Counts must match the control dataset.</text><text x="35" y="854" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#596778">All names, counts, dates and entry codes are mockup examples, not pilot measurements.</text></svg>